name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar estructura del proyecto
        run: |
          test -f README.md
          test -d Docs
          test -d .github/workflows

      - name: Verificar archivo del pipeline
        run: |
          test -f .github/workflows/ci.yml
          echo "Pipeline configurado correctamente"